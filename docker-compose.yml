version: '3.8'

services:
  miss:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miss
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TRANSCRIPTION_MODEL=${TRANSCRIPTION_MODEL:-openai/whisper-large-v3-turbo}
      - DESCRIPTION_MODEL=${DESCRIPTION_MODEL:-google/gemini-2.5-flash}
      - MISS_SERVICE_USER_ID=${MISS_SERVICE_USER_ID}
      - MISS_NOTE_PREFIX=${MISS_NOTE_PREFIX:-[Transcripción de audio]}
      - MISS_NOTE_PREFIX_IMAGE=${MISS_NOTE_PREFIX_IMAGE:-[Descripción de imagen]}
      - MISS_NOTE_PREFIX_DOCUMENT=${MISS_NOTE_PREFIX_DOCUMENT:-[Resumen de documento]}
      - RUNS_DB_PATH=${RUNS_DB_PATH:-/app/data/runs.db}
      - MISS_DASHBOARD_USER=${MISS_DASHBOARD_USER}
      - MISS_DASHBOARD_PASS=${MISS_DASHBOARD_PASS}
      - MISS_CORS_ORIGINS=${MISS_CORS_ORIGINS:-}
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  miss-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: miss-dashboard
    restart: unless-stopped
    depends_on:
      miss:
        condition: service_healthy
    environment:
      - TZ=America/Argentina/Buenos_Aires
      # El dashboard le habla a MISS por el nombre de container (misma red).
      - MISS_API_URL=${MISS_API_URL:-http://miss:8000}
      - MISS_API_USER=${MISS_DASHBOARD_USER}
      - MISS_API_PASS=${MISS_DASHBOARD_PASS}
    networks:
      - default
      - proxy
    healthcheck:
      # Next standalone no trae curl. wget está en la imagen alpine.
      # /api/health está excluido del middleware de auth.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3005/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

# nginx-proxy-manager_default es la red externa del NPM. Ambos servicios se
# unen para que NPM los resuelva por nombre: miss:8000 y miss-dashboard:3005.
networks:
  proxy:
    external: true
    name: nginx-proxy-manager_default
