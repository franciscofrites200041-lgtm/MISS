version: '3.8'

services:
  miss:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miss
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - SPOTER_API_USER=${SPOTER_API_USER}
      - SPOTER_API_PASS=${SPOTER_API_PASS}
      - TOKEN_CACHE_PATH=${TOKEN_CACHE_PATH:-/app/data/auth.json}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TRANSCRIPTION_MODEL=${TRANSCRIPTION_MODEL:-openai/whisper-large-v3-turbo}
      - MISS_SERVICE_USER_ID=${MISS_SERVICE_USER_ID}
      - MISS_NOTE_PREFIX=${MISS_NOTE_PREFIX:-[Transcripción de audio]}
      - RUNS_DB_PATH=${RUNS_DB_PATH:-/app/data/runs.db}
      - MISS_DASHBOARD_USER=${MISS_DASHBOARD_USER}
      - MISS_DASHBOARD_PASS=${MISS_DASHBOARD_PASS}
      - MISS_CORS_ORIGINS=${MISS_CORS_ORIGINS:-}
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

# proxy es la red externa de nginx-proxy-manager. MISS se une para que NPM lo
# resuelva por nombre de container (host interno: miss:8000).
networks:
  proxy:
    external: true
    name: nginx-proxy-manager_default
